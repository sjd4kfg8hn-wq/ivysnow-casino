<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Póker Alpino - IVYSNOWCASINO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: #030712;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
        }

        .btn-back {
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 16px; border-radius: 10px;
            font-size: 0.85rem; font-weight: 700;
            text-decoration: none;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            z-index: 100;
            transition: all 0.3s;
        }
        .btn-back:hover { background: #38bdf8; color: #000; box-shadow: 0 0 25px #38bdf8; }

        /* MESA CHASIS 3D DE PÓKER ALPINO */
        .poker-table-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background-image: url('../images/poker-alpino.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
            overflow: hidden;
        }

        /* CRUPIER (MUÑECO DE NIEVE) */
        .dealer-box {
            position: absolute;
            top: 18%;
            left: 45%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 6px 14px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        .dealer-avatar { font-size: 2rem; }
        .dealer-name { font-size: 0.65rem; color: #38bdf8; font-weight: 900; }

        /* CARTAS COMUNITARIAS EN EL CENTRO DEL TAPETE */
        .community-cards {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .card {
            width: 32px;
            height: 46px;
            background: #fff;
            color: #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.85rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .card.red { color: #e11d48; }

        /* BOTE CENTRAL */
        .pot-display {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(250, 204, 21, 0.2);
            border: 1px solid #facc15;
            color: #facc15;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 900;
        }

        /* JUGADORES ALREDEDOR DE LA MESA */
        .player-seat {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 6px;
            min-width: 80px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .player-seat.active-user {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }
        .avatar { font-size: 1.6rem; }
        .p-name { font-size: 0.6rem; font-weight: 800; color: #cbd5e1; }
        .p-chips { font-size: 0.65rem; color: #facc15; font-weight: 900; }

        /* POSICIONES DE LOS 6 JUGADORES */
        .seat-1 { bottom: 8%; left: 45%; transform: translateX(-50%); } /* TÚ (GAFAS/CASCO) */
        .seat-2 { bottom: 18%; left: 22%; } /* PINGÜINO */
        .seat-3 { top: 30%; left: 16%; }    /* MORSA */
        .seat-4 { top: 25%; left: 30%; }    /* OSO POLAR */
        .seat-5 { top: 25%; right: 30%; }   /* FOCA */
        .seat-6 { bottom: 18%; right: 22%; } /* HUSKY */

        /* CONTROLES DEL JUGADOR EN LA PARTE INFERIOR */
        .action-bar {
            position: absolute;
            bottom: 2%;
            right: 2%;
            display: flex;
            gap: 8px;
            background: rgba(3, 7, 18, 0.9);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .btn-act {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-act.fold { background: #e11d48; color: #fff; }
        .btn-act.raise { background: #facc15; color: #000; }
        .btn-act:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <a href="/ivysnow-casino/index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> LOBBY</a>

    <div class="poker-table-wrapper">
        
        <!-- CRUPIER MUÑECO DE NIEVE -->
        <div class="dealer-box">
            <span class="dealer-avatar">☃️</span>
            <span class="dealer-name">CRUPIER ÁRTICO</span>
        </div>

        <!-- CARTAS COMUNITARIAS Y BOTE -->
        <div class="community-cards" id="communityGrid">
            <div class="card red">A♥️</div>
            <div class="card">K♠️</div>
            <div class="card red">10♦️</div>
            <div class="card">J♣️</div>
            <div class="card red">Q♥️</div>
        </div>
        <div class="pot-display">BOTE: <span id="potAmount">300</span> 🏔️</div>

        <!-- JUGADOR 1: TÚ (CASCO Y GAFAS DE SNOWBOARD) -->
        <div class="player-seat seat-1 active-user">
            <span class="avatar">🥽</span>
            <span class="p-name">TÚ (RIDER)</span>
            <span class="p-chips" id="userChips">500</span>
        </div>

        <!-- JUGADOR 2: PINGÜINO -->
        <div class="player-seat seat-2">
            <span class="avatar">🐧</span>
            <span class="p-name">PINGÜINO</span>
            <span class="p-chips">420</span>
        </div>

        <!-- JUGADOR 3: MORSA -->
        <div class="player-seat seat-3">
            <span class="avatar">🦣</span>
            <span class="p-name">MORSA</span>
            <span class="p-chips">650</span>
        </div>

        <!-- JUGADOR 4: OSO POLAR -->
        <div class="player-seat seat-4">
            <span class="avatar">🐻‍❄️</span>
            <span class="p-name">OSO POLAR</span>
            <span class="p-chips">800</span>
        </div>

        <!-- JUGADOR 5: FOCA -->
        <div class="player-seat seat-5">
            <span class="avatar">🦭</span>
            <span class="p-name">FOCA</span>
            <span class="p-chips">310</span>
        </div>

        <!-- JUGADOR 6: HUSKY -->
        <div class="player-seat seat-6">
            <span class="avatar">🐺</span>
            <span class="p-name">HUSKY</span>
            <span class="p-chips">550</span>
        </div>

        <!-- BARRA DE BOTONES -->
        <div class="action-bar">
            <button class="btn-act fold" onclick="retirarse()">NO IR</button>
            <button class="btn-act" onclick="pasarOIgualar()">IGUALAR</button>
            <button class="btn-act raise" onclick="subirApuesta()">SUBIR (50)</button>
        </div>
    </div>

    <script>
        let userBalance = parseInt(localStorage.getItem('ivysnow_forfaits')) || 500;
        document.getElementById('userChips').textContent = userBalance;
        let pot = 300;

        function subirApuesta() {
            if (userBalance >= 50) {
                userBalance -= 50;
                pot += 50;
                localStorage.setItem('ivysnow_forfaits', userBalance);
                document.getElementById('userChips').textContent = userBalance;
                document.getElementById('potAmount').textContent = pot;
            } else {
                alert("¡Sin forfaits suficientes!");
            }
        }

        function pasarOIgualar() {
            alert("Has igualado la apuesta de la mesa.");
        }

        function retirarse() {
            alert("Te has retirado de esta mano.");
        }
    </script>
</body>
</html>
