<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Monte Pináculo - Blackjack VIP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }
        .casino-table-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 620px;
            background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
            border: 12px solid #78350f;
            border-radius: 200px 200px 40px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            margin-top: 10px;
        }
        /* Zona del Crupier */
        .dealer-zone {
            text-align: center;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 25px;
            border-radius: 12px;
            border: 1px solid #d4af37;
        }
        .dealer-dialogue {
            font-style: italic;
            color: #fbbf24;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        /* Asientos de los jugadores y bots */
        .seats-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 0 10px;
        }
        .seat {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #3b82f6;
            border-radius: 10px;
            padding: 8px;
            width: 170px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .seat.human {
            border-color: #d4af37;
            background: rgba(30, 41, 59, 0.95);
        }
        .seat h3 {
            font-size: 0.9rem;
            color: #93c5fd;
            margin-bottom: 2px;
        }
        .seat.human h3 {
            color: #fde047;
        }
        .seat .bet-info, .seat .bankroll-display {
            font-size: 0.8rem;
            color: #cbd5e1;
        }
        .seat .cards {
            min-height: 35px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- MESA DE JUEGO VIP -->
    <div class="casino-table-container">
        
        <!-- ZONA DEL CRUPIER -->
        <div class="dealer-zone">
            <h2>Gato Culturista - Crupier VIP</h2>
            <div id="dealer-dialogue" class="dealer-dialogue">"Bienvenidos a Monte Pináculo. Hagan sus apuestas, caballeros."</div>
            <div id="dealer-cards" class="cards" style="margin-top: 8px;"></div>
        </div>

        <!-- ASIENTOS DE LOS JUGADORES (IA Y HUMANO) -->
        <div class="seats-container">
            <!-- Bot 1 -->
            <div id="seat-1" class="seat">
                <h3>Shih Tzu (Quinqui)</h3>
                <div class="bet-info">Apuesta: 100€</div>
                <div class="cards"></div>
            </div>
            <!-- Bot 2 -->
            <div id="seat-2" class="seat">
                <h3>Husky (Seductor)</h3>
                <div class="bet-info">Apuesta: 1.000€</div>
                <div class="cards"></div>
            </div>
            <!-- Bot 3 -->
            <div id="seat-3" class="seat">
                <h3>Pitbull (La Diva)</h3>
                <div class="bet-info">Apuesta: 500€</div>
                <div class="cards"></div>
            </div>
            <!-- Bot 4 -->
            <div id="seat-4" class="seat">
                <h3>Dogo (Hippie)</h3>
                <div class="bet-info">Apuesta: 50€</div>
                <div class="cards"></div>
            </div>
            <!-- Jugador Humano VIP -->
            <div id="seat-human" class="seat human">
                <h3>Tú (VIP)</h3>
                <div class="bet-info" id="human-bet">Apuesta: 0€</div>
                <div class="bankroll-display">Saldo: <span id="player-bankroll">10.000€</span></div>
                <div class="cards"></div>
            </div>
        </div>

    </div>

    <!-- PANEL DE CONTROL VIP (APUESTAS Y ACCIONES) -->
    <div id="control-panel" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; background: rgba(0, 0, 0, 0.85); border-top: 2px solid #d4af37; border-radius: 12px; width: 100%; max-width: 1100px; margin-top: 10px;">
        
        <!-- FASE 1: APUESTAS -->
        <div id="betting-controls" style="display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;">
            <div class="chips-group" style="display: flex; gap: 6px;">
                <button class="chip-btn" data-value="10" style="background: #e5e7eb; color: #111; border-radius: 50%; width: 44px; height: 44px; font-weight: bold; border: 2px solid #9ca3af; cursor: pointer;">10€</button>
                <button class="chip-btn" data-value="100" style="background: #10b981; color: #fff; border-radius: 50%; width: 44px; height: 44px; font-weight: bold; border: 2px solid #059669; cursor: pointer;">100€</button>
                <button class="chip-btn" data-value="1000" style="background: #3b82f6; color: #fff; border-radius: 50%; width: 44px; height: 44px; font-weight: bold; border: 2px solid #2563eb; cursor: pointer;">1K</button>
                <button class="chip-btn" data-value="5000" style="background: #8b5cf6; color: #fff; border-radius: 50%; width: 44px; height: 44px; font-weight: bold; border: 2px solid #7c3aed; cursor: pointer;">5K</button>
                <button class="chip-btn" data-value="10000" style="background: #111827; color: #d4af37; border-radius: 50%; width: 44px; height: 44px; font-weight: bold; border: 2px solid #d4af37; cursor: pointer;">10K</button>
            </div>
            <button id="clear-btn" style="background: #4b5563; color: #fff; padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;">BORRAR APUESTA</button>
            <button id="deal-btn" style="background: #10b981; color: #fff; padding: 10px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;">REPARTIR</button>
        </div>

        <!-- FASE 2: ACCIONES DE JUEGO (Oculto al inicio) -->
        <div id="game-actions" style="display: none; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;">
            <button id="hit-btn" style="background: #2563eb; color: #fff; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;">PEDIR</button>
            <button id="stand-btn" style="background: #dc2626; color: #fff; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;">PLANTARSE</button>
            <button id="double-btn" style="background: #d97706; color: #fff; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;">DOBLAR</button>
            <button id="split-btn" style="background: #7c3aed; color: #fff; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: none;">DIVIDIR</button>
        </div>

        <!-- MODAL DE SEGURO (Oculto) -->
        <div id="insurance-modal" style="display: none; background: rgba(17, 24, 39, 0.95); padding: 8px 16px; border: 1px solid #d4af37; border-radius: 8px; color: #fff; gap: 10px; align-items: center;">
            <span style="font-size: 0.95rem; font-weight: bold;">¿Comprar Seguro (1:1)?</span>
            <button id="insurance-yes" style="background:#10b981; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">SÍ</button>
            <button id="insurance-no" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">NO</button>
        </div>

    </div>

    <!-- CARGA DEL MOTOR JAVASCRIPT COMO MÓDULO -->
    <script type="module" src="./js/game.js"></script>
</body>
</html>
