<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Egipcia VIP - IVYSNOWCASINO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-bright: #ffe57f;
            --gold-mid: #d4af37;
            --gold-dark: #8c6d1f;
            --cyan-glow: #00f2ff;
            --bg-pitch: #05070a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: var(--bg-pitch);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(0, 242, 255, 0.1) 0%, transparent 40%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .btn-back {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--gold-mid);
            color: var(--gold-bright);
            padding: 10px 20px; border-radius: 12px;
            font-weight: 700; text-decoration: none;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
        }
        .btn-back:hover { background: var(--gold-mid); color: #000; box-shadow: 0 0 25px var(--gold-bright); }

        /* MÁQUINA PRINCIPAL EGIPCIA CON DISEÑO 3D METALIZADO */
        .pharaoh-cabinet {
            background: linear-gradient(180deg, #1c150d 0%, #0a0805 100%);
            border: 4px solid var(--gold-mid);
            border-radius: 28px;
            width: 100%; max-width: 950px;
            padding: 35px;
            box-shadow: 
                0 0 60px rgba(212, 175, 55, 0.3),
                inset 0 0 40px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(0, 242, 255, 0.2);
            position: relative;
        }

        /* Detalle lateral del Skate Faraónico */
        .pharaoh-cabinet::before {
            content: "🛹 👁️ 🪲";
            position: absolute;
            left: -25px; top: 30%;
            transform: rotate(-90deg);
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-mid));
            padding: 8px 25px; border-radius: 20px;
            border: 2px solid var(--cyan-glow);
            font-size: 1.2rem;
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .cabinet-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--gold-dark);
            padding-bottom: 15px;
            position: relative;
        }

        .cabinet-title {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, var(--gold-bright) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            letter-spacing: 3px;
        }

        .subtitle-motto {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: var(--cyan-glow);
            letter-spacing: 5px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* FRAME DE LOS RODILLOS TIPO PANTALLA EGIPCIA */
        .reels-vault {
            background: #020305;
            border: 3px solid var(--gold-mid);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,1), 0 0 15px rgba(0, 242, 255, 0.3);
            margin-bottom: 25px;
        }

        .reels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .reel-column {
            background: linear-gradient(180deg, #090d14 0%, #111827 50%, #090d14 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .symbol-cell {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            filter: drop-shadow(0 0 8px rgba(255, 229, 127, 0.4));
            transition: transform 0.1s;
        }

        /* PANEL DE APUESTAS Y NEONES */
        .control-deck {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #0d1117 0%, #05070a 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 18px;
            padding: 20px;
            gap: 15px;
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-title { font-size: 0.7rem; color: var(--gold-bright); font-weight: 900; letter-spacing: 1px; }
        .stat-value { font-size: 1.4rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--gold-bright); }

        .btn-spin-egypt {
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-dark) 100%);
            color: #000;
            border: 2px solid #fff;
            padding: 18px 45px;
            border-radius: 16px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6), 0 0 15px var(--cyan-glow);
            transition: all 0.2s;
        }
        .btn-spin-egypt:hover { transform: scale(1.06); box-shadow: 0 0 45px var(--gold-bright); }

        /* RUEDAS CIBERNÉTICAS EN LA BASE DE LA MÁQUINA */
        .wheels-base {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            padding-top: 10px;
        }
        .cyber-wheel {
            width: 55px; height: 55px;
            border-radius: 50%;
            border: 3px solid var(--cyan-glow);
            background: #000;
            display: flex; align-items: center; justify-content: center;
            color: var(--gold-bright);
            font-size: 1.2rem;
            box-shadow: 0 0 15px var(--cyan-glow);
            animation: spinWheel 6s linear infinite;
        }
        @keyframes spinWheel { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <a href="../index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> VOLVER AL LOBBY</a>

    <div class="pharaoh-cabinet">
        <div class="cabinet-header">
            <div class="cabinet-title">SLOT EGIPCIA</div>
            <div class="subtitle-motto">RUEDA • JUEGA • CONQUISTA</div>
        </div>

        <div class="reels-vault">
            <div class="reels-grid">
                <div class="reel-column" id="r1">
                    <div class="symbol-cell">👁️</div><div class="symbol-cell">🛹</div><div class="symbol-cell">🪲</div><div class="symbol-cell">☥</div>
                </div>
                <div class="reel-column" id="r2">
                    <div class="symbol-cell">☥</div><div class="symbol-cell">👟</div><div class="symbol-cell">🔺</div><div class="symbol-cell">👁️</div>
                </div>
                <div class="reel-column" id="r3">
                    <div class="symbol-cell">🔺</div><div class="symbol-cell">👑</div><div class="symbol-cell">👁️</div><div class="symbol-cell">🪲</div>
                </div>
                <div class="reel-column" id="r4">
                    <div class="symbol-cell">🪲</div><div class="symbol-cell">🛹</div><div class="symbol-cell">☥</div><div class="symbol-cell">👟</div>
                </div>
                <div class="reel-column" id="r5">
                    <div class="symbol-cell">👑</div><div class="symbol-cell">🔺</div><div class="symbol-cell">🦅</div><div class="symbol-cell">🛹</div>
                </div>
            </div>
        </div>

        <div class="control-deck">
            <div class="stat-card">
                <span class="stat-title">FORFAITS</span>
                <span class="stat-value" id="bal">500</span>
            </div>

            <button class="btn-spin-egypt" id="spinBtn" onclick="girarEgipcia()">GIRAR ⚡</button>

            <div class="stat-card">
                <span class="stat-title">APUESTA TOTAL</span>
                <span class="stat-value" style="color: var(--cyan-glow);">50</span>
            </div>
        </div>

        <!-- Ruedas neón en la base inspiradas en la imagen -->
        <div class="wheels-base">
            <div class="cyber-wheel">☥</div>
            <div class="cyber-wheel">👁️</div>
            <div class="cyber-wheel">🪲</div>
            <div class="cyber-wheel">🛹</div>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('ivysnow_forfaits')) || 500;
        document.getElementById('bal').textContent = balance;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'spin') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.1);
                osc.frequency.setValueAtTime(783, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        const simbolos = ['👁️', '☥', '🔺', '🪲', '🛹', '👟', '🦅', '👑'];

        function girarEgipcia() {
            if (balance < 50) { alert("¡Sin saldo suficiente!"); return; }

            balance -= 50;
            localStorage.setItem('ivysnow_forfaits', balance);
            document.getElementById('bal').textContent = balance;
            playSound('spin');

            const btn = document.getElementById('spinBtn');
            btn.disabled = true;

            let count = 0;
            const timer = setInterval(() => {
                for(let i=1; i<=5; i++) {
                    const col = document.getElementById(`r${i}`).children;
                    for(let j=0; j<4; j++) {
                        col[j].textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
                    }
                }
                count++;
                if(count > 15) {
                    clearInterval(timer);
                    btn.disabled = false;
                    if(Math.random() < 0.5) {
                        balance += 150;
                        localStorage.setItem('ivysnow_forfaits', balance);
                        document.getElementById('bal').textContent = balance;
                        playSound('win');
                    }
                }
            }, 80);
        }
    </script>
</body>
</html>
