<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Snow Roulette - European Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #050b14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .main-container {
            width: 1200px;
            background: rgba(10, 22, 40, 0.95);
            border: 2px solid #2a4c7d;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* 1. Header Banner */
        .header-banner {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #4a7bb0;
            position: relative;
        }
        .header-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Top Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1b2e;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #1e3a5f;
        }
        .stat-box {
            font-size: 16px;
            font-weight: bold;
        }
        .stat-value {
            color: #00e5ff;
        }

        /* Game Core Grid */
        .game-grid {
            display: grid;
            grid-template-columns: 320px 1fr 240px;
            gap: 15px;
        }

        /* Left Column: Wheel & Bonus */
        .left-col {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .wheel-container {
            width: 320px;
            height: 320px;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 3px solid #b89758;
        }
        .wheel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
        }
        .wheel-pointer {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #ff2a2a;
            z-index: 10;
        }
        .bonus-banner {
            width: 100%;
            height: 120px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #2a528a;
        }
        .bonus-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Center Column: Felt Table */
        .center-col {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: url('images/table_felt.jpg') no-repeat center center;
            background-size: cover;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1a4931;
            position: relative;
        }
        .felt-table {
            display: grid;
            grid-template-columns: 40px repeat(12, 1fr) 50px;
            grid-template-rows: repeat(3, 40px) 35px 35px;
            gap: 3px;
            background: rgba(0, 40, 20, 0.7);
            padding: 5px;
            border-radius: 6px;
        }
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            border-radius: 3px;
            position: relative;
        }
        .cell:hover {
            filter: brightness(1.3);
            border-color: #ffe875;
        }
        .cell-red { background: #b51a1a; color: white; }
        .cell-black { background: #1a1a1a; color: white; }
        .cell-green { background: #1b8a3e; color: white; }
        .cell-special { background: rgba(0, 80, 50, 0.8); font-size: 11px; }

        .zero-cell { grid-row: 1 / 4; grid-column: 1; }
        .doz-cell { grid-row: 4; grid-span: 4; }
        .outside-cell { grid-row: 5; grid-span: 2; }

        /* Vecinos del 0 Track */
        .vecinos-track {
            display: flex;
            gap: 2px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #b89758;
        }
        .vecino-item {
            flex: 1;
            min-width: 24px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
        }

        /* Chips Controls */
        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 20, 35, 0.8);
            padding: 10px;
            border-radius: 6px;
        }
        .chips-rack-img {
            height: 60px;
            border-radius: 4px;
        }
        .chip-selector {
            display: flex;
            gap: 8px;
        }
        .chip-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px dashed #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }
        .chip-1 { background: #8c6239; color: white; }
        .chip-5 { background: #7d8c99; color: white; }
        .chip-25 { background: #1e7a46; color: white; }
        .chip-100 { background: #1d528c; color: white; }
        .chip-500 { background: #6b2d8c; color: white; }
        .chip-active { transform: scale(1.15); border-style: solid; border-color: #ffd700; }

        .btn-action {
            background: linear-gradient(180deg, #d4af37, #8a6d1c);
            border: none;
            color: black;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-action:hover { filter: brightness(1.2); }

        /* Right Column: Stats & History */
        .right-col {
            background: #0d1b2e;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1e3a5f;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-title {
            font-size: 14px;
            color: #00e5ff;
            border-bottom: 1px solid #1e3a5f;
            padding-bottom: 4px;
            text-transform: uppercase;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 100px;
            overflow-y: auto;
        }
        .history-badge {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
        }
        .chip-on-tile {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffd700;
            color: black;
            font-size: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            top: 2px;
            right: 2px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 1. Header Banner -->
    <div class="header-banner">
        <img src="images/logo_banner.jpg" alt="Alpine Snow Roulette">
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="stat-box">SALDO: <span class="stat-value" id="balance-display">€1,000.00</span></div>
        <div class="stat-box">APUESTA TOTAL: <span class="stat-value" id="bet-display">€0.00</span></div>
        <div class="stat-box">ÚLTIMA GANANCIA: <span class="stat-value" id="win-display">€0.00</span></div>
    </div>

    <!-- Main Grid -->
    <div class="game-grid">
        <!-- Left: Wheel & Avalanche Bonus -->
        <div class="left-col">
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <img src="images/roulette_wheel.jpg" id="roulette-wheel" class="wheel-img" alt="Ruleta">
            </div>
            <div class="bonus-banner">
                <img src="images/avalanche_bonus.jpg" alt="Avalancha Bonus">
            </div>
        </div>

        <!-- Center: Felt Table -->
        <div class="center-col">
            <div class="felt-table" id="felt-table">
                <!-- Se genera dinámicamente -->
            </div>

            <div style="font-size:11px; color:#aaa; margin-top:5px;">VECINOS DEL 0:</div>
            <div class="vecinos-track" id="vecinos-track">
                <!-- Se genera dinámicamente -->
            </div>

            <div class="controls-panel">
                <img src="images/chips_rack.jpg" class="chips-rack-img" alt="Fichas">
                <div class="chip-selector">
                    <div class="chip-btn chip-1 chip-active" onclick="selectChip(1, this)">€1</div>
                    <div class="chip-btn chip-5" onclick="selectChip(5, this)">€5</div>
                    <div class="chip-btn chip-25" onclick="selectChip(25, this)">€25</div>
                    <div class="chip-btn chip-100" onclick="selectChip(100, this)">€100</div>
                    <div class="chip-btn chip-500" onclick="selectChip(500, this)">€500</div>
                </div>
                <button class="btn-action" onclick="spinWheel()">GIRAR</button>
            </div>
        </div>

        <!-- Right: Stats & History -->
        <div class="right-col">
            <div class="panel-title">Historial (Últimos 20)</div>
            <div class="history-list" id="history-list"></div>

            <div class="panel-title">Números Calientes</div>
            <div id="hot-numbers" style="font-size: 12px; color:#ff9900;">17, 32, 8, 24, 22</div>

            <div class="panel-title">Números Fríos</div>
            <div id="cold-numbers" style="font-size: 12px; color:#00e5ff;">1, 22, 35, 6, 8</div>

            <div class="panel-title">Analista Alpino</div>
            <div style="font-size: 11px; line-height: 1.6;">
                Rojo: <span id="stat-red">50%</span> | Negro: <span id="stat-black">50%</span><br>
                Par: <span id="stat-even">50%</span> | Impar: <span id="stat-odd">50%</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Orden exacto ruleta europea de 37 números
    const wheelOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

    let currentBalance = 1000;
    let currentBetTotal = 0;
    let selectedChipValue = 1;
    let placedBets = {};
    let spinHistory = [];
    let isSpinning = false;

    // Locución "No va más" sintetizada
    function speakNoVaMas() {
        if ('speechSynthesis' in window) {
            const msg = new SpeechSynthesisUtterance("¡No va más, hagan sus apuestas!");
            msg.lang = 'es-ES';
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
        }
    }

    function selectChip(val, el) {
        selectedChipValue = val;
        document.querySelectorAll('.chip-btn').forEach(c => c.classList.remove('chip-active'));
        el.classList.add('chip-active');
    }

    // Inicializar Tapete
    function initFeltTable() {
        const table = document.getElementById('felt-table');
        table.innerHTML = '';

        // Cero
        const zero = document.createElement('div');
        zero.className = 'cell cell-green zero-cell';
        zero.innerText = '0';
        zero.onclick = () => placeBet('num_0', zero);
        table.appendChild(zero);

        // Cuadrícula 1-36 en orden estándar de tapete
        for (let row = 0; row < 3; row++) {
            for (let col = 1; col <= 12; col++) {
                const num = (3 - row) + (col - 1) * 3;
                const cell = document.createElement('div');
                const isRed = redNumbers.includes(num);
                cell.className = `cell ${isRed ? 'cell-red' : 'cell-black'}`;
                cell.style.gridRow = row + 1;
                cell.style.gridColumn = col + 1;
                cell.innerText = num;
                cell.onclick = () => placeBet(`num_${num}`, cell);
                table.appendChild(cell);
            }
        }

        // Vecinos del 0 track
        const track = document.getElementById('vecinos-track');
        track.innerHTML = '';
        const vecinosOrder = [22, 18, 29, 7, 28, 12, 35, 3, 26, 0, 32, 15, 19, 4, 21];
        vecinosOrder.forEach(n => {
            const item = document.createElement('div');
            const isRed = redNumbers.includes(n);
            item.className = `vecino-item ${n === 0 ? 'cell-green' : (isRed ? 'cell-red' : 'cell-black')}`;
            item.innerText = n;
            item.onclick = () => placeBet(`num_${n}`, item);
            track.appendChild(item);
        });
    }

    function placeBet(key, element) {
        if (isSpinning) return;
        if (currentBalance < selectedChipValue) return;

        currentBalance -= selectedChipValue;
        currentBetTotal += selectedChipValue;
        placedBets[key] = (placedBets[key] || 0) + selectedChipValue;

        // Visual Chip
        let chipBadge = element.querySelector('.chip-on-tile');
        if (!chipBadge) {
            chipBadge = document.createElement('div');
            chipBadge.className = 'chip-on-tile';
            element.appendChild(chipBadge);
        }
        chipBadge.innerText = placedBets[key];

        updateUI();
    }

    function updateUI() {
        document.getElementById('balance-display').innerText = `€${currentBalance.toFixed(2)}`;
        document.getElementById('bet-display').innerText = `€${currentBetTotal.toFixed(2)}`;
    }

    function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;

        // Anuncio de voz
        speakNoVaMas();

        const wheelImg = document.getElementById('roulette-wheel');
        const winningIndex = Math.floor(Math.random() * wheelOrder.length);
        const winningNumber = wheelOrder[winningIndex];

        // Calcular ángulo
        const degreesPerSlice = 360 / 37;
        const targetDegrees = 1440 + (winningIndex * degreesPerSlice);

        wheelImg.style.transform = `rotate(${targetDegrees}deg)`;

        setTimeout(() => {
            isSpinning = false;
            processWin(winningNumber);
            wheelImg.style.transition = 'none';
            wheelImg.style.transform = `rotate(${winningIndex * degreesPerSlice}deg)`;
            setTimeout(() => wheelImg.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.35, 1)', 50);
        }, 4000);
    }

    function processWin(winningNum) {
        let winAmount = 0;
        if (placedBets[`num_${winningNum}`]) {
            winAmount += placedBets[`num_${winningNum}`] * 36;
        }

        currentBalance += winAmount;
        document.getElementById('win-display').innerText = `€${winAmount.toFixed(2)}`;

        // Historial
        spinHistory.unshift(winningNum);
        if (spinHistory.length > 20) spinHistory.pop();
        renderHistory();

        // Limpiar apuestas
        placedBets = {};
        currentBetTotal = 0;
        document.querySelectorAll('.chip-on-tile').forEach(c => c.remove());
        updateUI();
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        spinHistory.forEach(n => {
            const badge = document.createElement('div');
            const isRed = redNumbers.includes(n);
            badge.className = `history-badge ${n === 0 ? 'cell-green' : (isRed ? 'cell-red' : 'cell-black')}`;
            badge.innerText = n;
            list.appendChild(badge);
        });
    }

    window.onload = () => {
        initFeltTable();
    };
</script>
</body>
</html>
